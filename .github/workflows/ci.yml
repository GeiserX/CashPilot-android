name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle*'
      - 'gradle.properties'
      - '.github/workflows/ci.yml'
  # Every PR runs this workflow, so "test" can be a required check. The
  # filter step below decides whether the Gradle steps run; on a PR that
  # touches none of these paths they are skipped and the check passes fast.
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Same list as the push trigger above. On a PR the filter reads the
      # changed files from the API. Outside a PR (push, manual run) every
      # step runs.
      - name: Filter paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            code:
              - 'app/**'
              - 'gradle/**'
              - '*.gradle*'
              - 'gradle.properties'
              - '.github/workflows/ci.yml'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes

      # The release keystore password sat in a tracked CLAUDE.md, in this
      # PUBLIC repo, from 2026-05-25 to 2026-08-06. GitGuardian ran on every PR
      # throughout and passed: it looks for high-entropy tokens, and what was
      # committed was a short memorable phrase in a sentence. This checks for
      # the shape a HUMAN writes instead, which is the half a scanner misses.
      # Needs no JDK, so it runs before the expensive setup.
      - name: No credentials in tracked files
        run: ./scripts/check-no-committed-credentials.sh

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
      - name: Unit tests and coverage
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        run: ./gradlew jacocoTestReport

      # The icon goldens (CashPilot-android-vxb). Roborazzi renders Compose on
      # the JVM through Robolectric, so this needs no emulator and no device.
      #
      # verify, never record: a CI job that RE-RECORDS makes every change agree
      # with itself, which is the one outcome a visual gate must never produce.
      - name: Verify icon and screen goldens
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        run: ./gradlew verifyRoborazziDebug

      # The diffs are the whole point when this fails -- a red check saying
      # "an image changed" with no image is not actionable.
      - name: Upload golden diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roborazzi-diffs
          path: app/build/outputs/roborazzi/
          if-no-files-found: ignore
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: github.event_name == 'push'
        with:
          files: app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          fail_ci_if_error: false
